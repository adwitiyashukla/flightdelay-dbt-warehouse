version: 2

models:
  - name: dim_date
    description: One row per calendar day covered by the flight data, with US holiday flags
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
      - name: date_day
        tests:
          - unique
          - not_null
      - name: calendar_month
        tests:
          - within_range:
              arguments:
                min_value: 1
                max_value: 12

  - name: dim_airport
    description: Conformed airport dimension covering the FAA list and every flight endpoint
    columns:
      - name: airport_key
        tests:
          - unique
          - not_null
      - name: airport_code
        tests:
          - unique
          - not_null
      - name: airport_name
        tests:
          - not_null
      - name: flight_count_2013
        tests:
          - non_negative

  - name: dim_carrier
    description: Carrier dimension enriched with OpenFlights ICAO code and callsign
    columns:
      - name: carrier_key
        tests:
          - unique
          - not_null
      - name: carrier_code
        tests:
          - unique
          - not_null

  - name: dim_aircraft
    description: One row per tail number that actually flew, with reference coverage flagged
    columns:
      - name: aircraft_key
        tests:
          - unique
          - not_null
      - name: tail_number
        tests:
          - unique
          - not_null
      - name: size_class
        tests:
          - accepted_values:
              arguments:
                values: ["regional", "narrowbody", "widebody", "unknown"]
      - name: age_years_in_2013
        tests:
          - non_negative:
              config:
                where: age_years_in_2013 is not null

  - name: fct_flight
    description: One row per scheduled departure, joined to hourly origin weather
    columns:
      - name: flight_key
        tests:
          - unique
          - not_null
      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: carrier_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_carrier')
                field: carrier_key
      - name: origin_airport_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key
      - name: destination_airport_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_airport')
                field: airport_key
      - name: aircraft_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_aircraft')
                field: aircraft_key
              config:
                where: tail_number is not null
      - name: distance_miles
        tests:
          - non_negative
      - name: scheduled_departure_hour_local
        tests:
          - within_range:
              arguments:
                min_value: 0
                max_value: 23
