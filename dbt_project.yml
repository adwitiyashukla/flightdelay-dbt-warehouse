name: flightdelay
version: "0.1.0"
profile: flightdelay

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
test-paths: ["dbt_tests"]

clean-targets: ["target", "dbt_packages"]

models:
  flightdelay:
    staging:
      +materialized: view
      +schema: staging
    warehouse:
      +materialized: table
      +schema: warehouse
    marts:
      +materialized: table
      +schema: marts

seeds:
  flightdelay:
    +schema: seed
    us_holidays_2013:
      +column_types:
        holiday_date: date
