[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightdelay"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
    "duckdb>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "sqlfluff>=3.0",
]

[project.scripts]
flightdelay = "flightdelay.cli:main"

[tool.setuptools]
packages = ["flightdelay"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E501"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
